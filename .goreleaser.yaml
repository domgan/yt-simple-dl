# Fyne needs CGO; tag releases use .github/workflows/release.yml. Local: goreleaser build --clean --snapshot --single-target
version: 2

project_name: yt-simple-dl

before:
  hooks:
    - go mod tidy

builds:
  - id: yt-simple-dl
    binary: yt-simple-dl
    main: .
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.VERSION={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: domgan
    name: yt-simple-dl
  mode: keep-existing
